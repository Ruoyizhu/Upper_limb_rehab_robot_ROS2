# 仿真集成测试参数配置
test_teleop_node:
  ros__parameters:
    control_gain: 0.1      # 控制增益系数
    max_intent: 1.0       # 最大意图值
    publish_frequency: 10.0  # 发布频率 (Hz)

# 测试场景参数
integration_test:
  ros__parameters:
    test_duration: 60.0    # 测试持续时间 (秒)
    safety_test_enabled: true  # 是否启用安全测试
    performance_logging: true  # 是否启用性能日志